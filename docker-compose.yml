services:
  api:
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    command:
      - uvicorn
      - story_companion.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - "${LOG_LEVEL:-info}"
